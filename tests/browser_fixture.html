<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Network Observatory test — synthetic only</title></head>
<body><div id="smoke" data-status="pending">Executando fixture</div>
<iframe id="frame" src="/router/" style="width:1300px;height:900px"></iframe>
<script>
(async()=>{
 const out=document.getElementById('smoke'),frame=document.getElementById('frame'),notes=[];
 const sleep=n=>new Promise(r=>setTimeout(r,n));
 const wait=async(fn,label,ms=13000)=>{const start=Date.now();while(Date.now()-start<ms){const r=fn();if(r)return r;await sleep(35);}throw Error('Timeout '+label)};
 const assert=(value,msg)=>{if(!value)throw Error(msg)};
 try{
  await wait(()=>frame.contentDocument?.getElementById('modeToggle'),'shell');
  const d=frame.contentDocument,w=frame.contentWindow;
  await wait(()=>w.FNO?.state?.resources?.status?.phase==='ready','first status');
  await wait(()=>d.querySelectorAll('.observation-source').length===3,'additional source panel');
  d.querySelector('a[href="#routerObservability"]').click();await wait(()=>w.location.hash==='#routerObservability','source navigation anchor');
  assert(d.querySelector('.observation-collector').textContent.includes('Autenticação bloqueada'),'collector authentication state missing');
  const source=d.querySelector('.observation-source');source.open=true;
  assert(source.textContent.includes('Auto. 20/40/80 MHz'),'configured width was not decoded');
  assert(source.textContent.includes('<img src=x onerror=alert(1)>')&&!source.querySelector('img'),'source label was interpreted as HTML');
  source.querySelector('button').click();await wait(()=>source.textContent.includes('Primeiras 1 observações'),'observation archive');
  const change=[...d.querySelectorAll('#routerObservability button')].find(n=>n.textContent==='Comparar leituras');
  change.closest('details').open=true;change.click();await wait(()=>change.parentElement.textContent.includes('1234'),'before/after comparison');
  frame.style.width='320px';await sleep(100);
  assert(d.documentElement.scrollWidth<=d.documentElement.clientWidth+2,'mobile page overflows '+d.documentElement.scrollWidth+'/'+d.documentElement.clientWidth+' '+[...d.querySelectorAll('body *')].filter(n=>n.getBoundingClientRect().right>d.documentElement.clientWidth+2&&!n.closest('.observation-table')).slice(0,8).map(n=>n.tagName+'.'+n.className).join(', '));
  frame.style.width='1300px';
  assert(d.querySelector('[data-metric="cpu"]').textContent.trim()==='0','real zero CPU lost');
  assert(['loading','error'].includes(w.FNO.state.resources.overview.phase),'status not independently available from summary');
  assert(d.querySelector('.metric-card[data-detail=router]').getAttribute('aria-busy')==='false','CPU card still busy after status');
  assert(d.querySelector('.hero-score').getAttribute('aria-busy')===String(w.FNO.state.resources.overview.phase==='loading'),'Coverage block state differs from its own resource');
  notes.push('status visible before history');
  await wait(()=>w.FNO.state.resources.overview.phase==='error','summary HTTP500');
  assert(w.FNO.state.api===true,'history error incorrectly marked server offline');
  assert(d.querySelector('#overviewState [data-retry-resource="overview"]'),'missing local retry');
  notes.push('history error isolated');
  d.querySelector('#overviewState [data-retry-resource="overview"]').click();
  assert(d.querySelector('.hero-score').getAttribute('aria-busy')==='true','Coverage retry missing immediate loading');
  await wait(()=>w.FNO.state.resources.overview.phase==='ready','overview retry');
  assert(w.FNO.state.overview.summary.sampled===true,'home requested full expensive history');
  assert(d.querySelector('#overviewChart svg'),'summary chart not drawn');
  assert([...d.querySelectorAll('#overviewChart .history-series-line')].every(p=>p.getAttribute('d').includes('L')),'Preview incorrectly shown as disconnected points');
  assert(d.querySelector('.hero-score').getAttribute('aria-busy')==='false','Coverage block stuck busy');
  assert(d.querySelector('.hero-score > .block-load-status').hidden,'Loading badge remained after response');
  assert(w.FNO.state.resources.inventory.phase==='empty','valid empty inventory misclassified');
  const hover=d.querySelector('#overviewChart .inspect-area'),rect=hover.getBoundingClientRect();
  hover.dispatchEvent(new w.PointerEvent('pointermove',{clientX:rect.left+rect.width*.4,clientY:rect.top+rect.height*.5,bubbles:true}));
  assert(!d.querySelector('#overviewChart .chart-inspector').hidden,'Nearest reading should be accessible between points');
  assert(d.querySelector('#overviewChart .chart-inspector').textContent.includes('leitura mais próxima'),'Nearest source must be explicit');
  assert(d.querySelector('[data-metric="down"]').textContent===w.FNO.fmt(2,2),'WAN card must use observed increments, not raw counter');
  assert(d.querySelector('#spark-traffic path').getAttribute('d').includes('L'),'WAN card observed line missing');
  assert(d.querySelector('[data-metric="down"]').closest('.metric-card').textContent.includes('Última hora · soma parcial'),'WAN card period/partial semantics missing');
  notes.push('summary retry, WAN observed card and [] inventory');
  const trigger=d.querySelector('.nav-item[data-detail="latency"]');
  trigger.focus();trigger.click();
  await wait(()=>!d.getElementById('sheetLayer').hidden,'sheet opening');
  assert(d.getElementById('legendBox').textContent.includes('TCP gateway'),'stale legend inherited from traffic');
  assert(d.querySelector('[data-period="24h"]').getAttribute('aria-pressed')==='true','initial range not active');
  assert(d.getElementById('historyChart').getAttribute('aria-busy')==='true','loading missing aria busy');
  assert(d.querySelector('#historyChart .load-placeholder'),'Chart skeleton missing');assert(d.querySelector('#detailStats .load-placeholder'),'Statistic skeletons missing');notes.push('correct immediate legend/range');
  d.querySelector('[data-period="7d"]').click();
  d.querySelector('[data-period="1y"]').click();
  assert(d.querySelector('[data-period="1y"]').getAttribute('aria-pressed')==='true','new period not selected immediately');
  assert(d.querySelector('[data-period="7d"]').getAttribute('aria-pressed')==='false','old period still marked active');
  assert(d.getElementById('chartSubtitle').textContent.includes('1y'),'old subtitle visible as current');
  await wait(()=>d.getElementById('historyChart').dataset.phase==='error','synthetic year HTTP500');
  assert(d.querySelector('#historyChart [data-sheet-retry]'),'missing year retry');
  notes.push('rapid period change and error');
  d.querySelector('#historyChart [data-sheet-retry]').click();
  await wait(()=>d.getElementById('historyChart').dataset.phase==='ready','year retry ready');
  assert(!d.getElementById('exportCsv').disabled,'export not enabled after valid bundle');
  notes.push('retry and valid bundle');
  // 1y bundle is reusable; second same-year selection after a short trip should not refetch.
  d.querySelector('[data-period="6h"]').click();
  d.querySelector('[data-period="1y"]').click();
  await wait(()=>d.getElementById('historyChart').dataset.phase==='ready','cached year');
  assert(d.querySelector('[data-period="1y"]').getAttribute('aria-pressed')==='true','cached period mismatch');
  notes.push('reuse cached full-year bundle');
  d.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
  assert(d.getElementById('sheetLayer').hidden,'Escape did not close sheet');
  assert(d.activeElement===trigger,'focus did not return after closing sheet');
  notes.push('escape and focus return');
  d.querySelector('[data-detail="traffic"]').click();
  await wait(()=>d.getElementById('historyChart').dataset.phase==='ready','WAN detail ready');
  assert(d.getElementById('chartTitle').textContent==='Incrementos WAN observados','WAN default must be observed increments');
  assert(d.getElementById('detailStats').textContent.includes('Transições excluídas'),'WAN exclusions hidden');
  assert(d.getElementById('detailDesc').textContent.includes('Não é consumo total'),'Incomplete sum must be explicit');
  d.querySelector('[data-counter-mode="raw"]').click();
  assert(d.getElementById('chartTitle').textContent==='Contadores WAN','Raw counters toggle missing');
  d.querySelector('[data-counter-mode="observed"]').click();
  assert(d.getElementById('chartTitle').textContent==='Incrementos WAN observados','Observed mode not restored');
  notes.push('WAN observed increments and raw toggle');
  out.dataset.status='pass';out.textContent=notes.join(' | ');
 }catch(e){out.dataset.status='fail';out.textContent=String(e.message||e);console.error(e);}
})();
</script></body></html>
